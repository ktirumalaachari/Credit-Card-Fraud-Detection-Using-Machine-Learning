<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Card Fraud Detection System</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1976d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="FraudDetect" />
    <meta
      name="description"
      content="AI-powered credit card fraud detection system"
    />

    <!-- Icons -->
    <link rel="icon" href="{{ url_for('static', filename='images/1.ico') }}" />
    <link
      rel="apple-touch-icon"
      href="{{ url_for('static', filename='images/icon-192.png') }}"
    />

    <!-- Manifest -->
    <link
      rel="manifest"
      href="{{ url_for('static', filename='manifest.json') }}"
    />

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body class="auth-page">
    <div class="auth-container">
      <h2>Create Account</h2>

      <!-- SIGNUP FORM -->
      <div id="signupBox">
        <input type="text" id="name" placeholder="Full Name" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />

        <button onclick="signup()">Signup</button>
      </div>

      <!-- OTP VERIFY FORM -->
      <div id="otpBox" style="display: none">
        <h3>Enter OTP</h3>
        <input type="text" id="otp" placeholder="Enter OTP" />
        <button onclick="verifyOTP()">Verify</button>
      </div>

      <!--  LOADER -->
      <div class="loader" id="loader"></div>

      <p>
        Already have an account ?
        <a href="/login">Login</a>
      </p>
    </div>

    <!--  TOAST -->
    <div id="toast" class="toast"></div>

    <!-- Footer -->
    <footer class="footer-bottom">
      <p>
        &copy; 2026 Credit Card Fraud Detection System. All rights reserved.
      </p>
      <p>Built with ❤️ using Machine Learning</p>
    </footer>

    <!-- IMPORTANT CHANGE -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
  </body>
</html>
